name: Deploy ITS Admin Portal

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # -------------------------------------------------------
  # Job 1: Build & test the frontend
  # -------------------------------------------------------
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (Vite)
        run: npm run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # -------------------------------------------------------
  # Job 2: Deploy to EC2 (only after build succeeds)
  # -------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build  # Only runs if build job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          # Copy backend files to EC2
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='node_modules' \
            --exclude='tickets_db.json' \
            backend/ ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/its-admin/backend/

          # Install dependencies and restart with PM2
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} "
            cd /home/ec2-user/its-admin/backend
            npm install --production
            pm2 restart its-backend || pm2 start server.js --name its-backend
            pm2 save
          "

      - name: Deploy frontend
        run: |
          # Copy the pre-built dist folder to EC2
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/its-admin/frontend/dist/

          # Restart the static file server
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} "
            pm2 restart its-frontend || pm2 start 'serve -s /home/ec2-user/its-admin/frontend/dist -l 3000' --name its-frontend
            pm2 save
          "

      - name: Health check
        run: |
          sleep 5
          curl --fail http://${{ secrets.EC2_HOST }}:3001/health || exit 1
          echo "✅ Backend health check passed"

      - name: Notify success
        if: success()
        run: echo "🚀 Deployment to ${{ secrets.EC2_HOST }} succeeded"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed — check logs above"
